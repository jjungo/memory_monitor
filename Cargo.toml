[package]
name = "memory_monitor"
version = "0.1.0"
edition = "2021"
description = "TUI hexdump monitor for live target memory over a SEGGER J-Link (nRF52840)"

[[bin]]
name = "memory_monitor"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"
libloading = "0.8"
object = { version = "0.39.1", default-features = false, features = ["read", "std", "elf"] }

[profile.release]
opt-level = 3
lto = true
